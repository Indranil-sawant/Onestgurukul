<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onest Header Redesign</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />

    <style>
        /* =========================================
       COPY THIS CSS BLOCK
       ========================================= */

        /* --- ONEST HEADER STYLES --- */
        .onest-header {
            --onest-yellow: #FACC15;
            --onest-yellow-hover: #EAB308;
            --onest-dark: #111827;
            --onest-gray: #4B5563;
            --onest-white: #FFFFFF;

            background-color: var(--onest-white);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
        }

        .onest-header-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Logo */
        .onest-logo {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .onest-logo img {
            max-height: 50px;
            width: auto;
            transition: transform 0.3s ease;
        }

        .onest-logo:hover img {
            transform: scale(1.05);
        }

        /* Desktop Navigation */
        .onest-nav-menu {
            display: none;
        }

        @media (min-width: 992px) {
            .onest-nav-menu {
                display: block;
            }
        }

        .onest-nav-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .onest-nav-item {
            position: relative;
        }

        .onest-nav-link {
            text-decoration: none;
            color: var(--onest-dark);
            font-weight: 500;
            font-size: 16px;
            transition: color 0.3s ease;
            padding: 8px 0;
            position: relative;
        }

        .onest-nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: var(--onest-yellow);
            transition: width 0.3s ease;
        }

        .onest-nav-link:hover {
            color: var(--onest-yellow-hover);
        }

        .onest-nav-link:hover::after {
            width: 100%;
        }

        .onest-nav-link.active {
            color: var(--onest-yellow-hover);
            font-weight: 600;
        }

        .onest-nav-link.active::after {
            width: 100%;
        }

        /* CTA Button in Nav */
        .onest-nav-btn {
            background-color: var(--onest-yellow);
            color: #000;
            padding: 10px 24px;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(250, 204, 21, 0.3);
        }

        .onest-nav-btn:hover {
            background-color: var(--onest-yellow-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(250, 204, 21, 0.4);
        }

        .onest-nav-btn::after {
            display: none;
            /* Remove underline effect for button */
        }

        /* Mobile Toggle */
        .onest-mobile-toggle {
            display: block;
            font-size: 28px;
            color: var(--onest-dark);
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }

        @media (min-width: 992px) {
            .onest-mobile-toggle {
                display: none;
            }
        }

        /* Mobile Menu Overlay (Simple CSS implementation for demo) */
        .onest-mobile-menu-container {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            height: 100vh;
            background: rgba(255, 255, 255, 0.98);
            z-index: 1001;
            transition: right 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .onest-mobile-menu-container.active {
            right: 0;
        }

        .onest-mobile-close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 32px;
            cursor: pointer;
            color: var(--onest-dark);
        }

        .onest-mobile-list {
            list-style: none;
            padding: 0;
            text-align: center;
        }

        .onest-mobile-list li {
            margin: 20px 0;
        }

        .onest-mobile-link {
            font-size: 22px;
            color: var(--onest-dark);
            text-decoration: none;
            font-weight: 600;
        }

        .onest-mobile-link:hover {
            color: var(--onest-yellow);
        }
    </style>
</head>

<body style="margin: 0; background-color: #f9f9f9; height: 200vh;">

    <!-- =========================================
       COPY THIS HEADER HTML
       ========================================= -->

    <header id="header" class="onest-header">
        <div class="onest-header-container">

            <!-- Logo -->
            <a href="index.html" class="onest-logo">
                <img src="assets/img/onest.svg" alt="O'Nest Gurukul">
            </a>

            <!-- Desktop Navigation -->
            <nav class="onest-nav-menu">
                <ul class="onest-nav-list">
                    <li class="onest-nav-item"><a href="index.html" class="onest-nav-link active">Home</a></li>
                    <li class="onest-nav-item"><a href="about.html" class="onest-nav-link">About Us</a></li>
                    <li class="onest-nav-item"><a href="students-life.html" class="onest-nav-link">Curriculum</a></li>
                    <li class="onest-nav-item"><a href="campus-facilities.html" class="onest-nav-link">Campus &amp;
                            Facilities</a></li>
                    <li class="onest-nav-item"><a href="contact.html" class="onest-nav-link">Contact</a></li>
                    <li class="onest-nav-item"><a href="admissions.html"
                            class="onest-nav-link onest-nav-btn">Admissions</a></li>
                </ul>
            </nav>

            <!-- Mobile Toggle Button -->
            <button class="onest-mobile-toggle"
                onclick="document.querySelector('.onest-mobile-menu-container').classList.add('active')">
                <i class="bi bi-list"></i>
            </button>

        </div>

        <!-- Mobile Menu Overlay (Optional structure if you want a custom mobile menu) -->
        <div class="onest-mobile-menu-container">
            <div class="onest-mobile-close"
                onclick="document.querySelector('.onest-mobile-menu-container').classList.remove('active')">
                <i class="bi bi-x"></i>
            </div>
            <ul class="onest-mobile-list">
                <li><a href="index.html" class="onest-mobile-link">Home</a></li>
                <li><a href="about.html" class="onest-mobile-link">About Us</a></li>
                <li><a href="students-life.html" class="onest-mobile-link">Curriculum</a></li>
                <li><a href="campus-facilities.html" class="onest-mobile-link">Campus &amp; Facilities</a></li>
                <li><a href="contact.html" class="onest-mobile-link">Contact</a></li>
                <li><a href="admissions.html" class="onest-mobile-link" style="color: #EAB308;">Admissions</a></li>
            </ul>
        </div>

    </header>

</body>

</html>
